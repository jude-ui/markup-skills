<div class="wrap_slide_exhibit"><!-- wrap_slide_exhibit, wrap_slide_visual 과 같이 내용에 따라 Suffix 적용 -->
  <div class="swiper" data-swiper-name="슬라이드 이름">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
        <!-- 슬라이드 아이템 전체 링크가 필요시  -->
        <a href="#none" class="link_slide">
          <!-- ... -->
        </a>
      </div>
      <div class="swiper-slide">
        <!-- 링크가 있는 배너가 필요한 경우 -->
        <a href="#none" class="link_slide">
          <img src="https://placehold.co/300x200" class="img_slide" alt="">
        </a>
      </div>
      <div class="swiper-slide">
        <!-- 그 밖에 케이스들은 시안에 맞는 구조로 작성 -->
      </div>
    </div>
  </div>
  
  <div class="wrap_nav">
    <div class="paging_slide"></div>
    <button type="button" class="btn_action btn_prev" title="이전 슬라이드">
      <i class="fa-solid fa-angle-left"></i>
    </button>
    <button type="button" class="btn_action btn_next" title="다음 슬라이드">
      <i class="fa-solid fa-angle-right"></i>
    </button>
    <button type="button" class="btn_ctrl btn_pause active" title="정지">
      <i class="fa-solid fa-pause"></i>
    </button>
    <button type="button" class="btn_ctrl btn_play" title="재생">
      <i class="fa-solid fa-play"></i>
    </button>
  </div>
</div>
